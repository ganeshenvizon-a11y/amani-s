<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amani's Kitchen — Cinematic Entrance</title>
<link rel="stylesheet" href="css/cinematic.css">
</head>
<body>

<!-- ============================================
     CINEMATIC VIDEO SCROLL SECTION
     Amani's Kitchen — Home Page opening experience
     ============================================ -->
<section class="cinematic-section" id="cinematicSection">

  <!-- Sticky viewport: stays fixed while the outer section scrolls past -->
  <div class="cinematic-stage" id="cinematicStage">

    <!-- Scroll-scrubbed video (web-optimized: short-GOP H.264, no audio track) -->
    <video
      class="cinematic-video"
      id="cinematicVideo"
      muted
      playsinline
      preload="auto"
    >
      <!-- A dedicated mobile source can be added here later, e.g.:
           <source src="assets/video/Restaurant fpv-concept-mobile.mp4" media="(max-width: 768px)" type="video/mp4"> -->
      <source src="assets/video/Restaurant fpv-concept-web.mp4" type="video/mp4">
    </video>

    <!-- Subtle dark overlay so logo/UI stay readable -->
    <div class="cinematic-overlay" id="cinematicOverlay"></div>

    <!-- Intro layer: scroll indicator (logo is embedded in the video itself) -->
    <div class="intro-layer" id="introLayer">
      <div class="scroll-indicator" id="scrollIndicator">
        <span class="scroll-arrow" aria-hidden="true">&#8595;</span>
        <span class="scroll-label">Scroll to Enter</span>
      </div>
    </div>

    <!-- Final reveal layer: welcome message + navigation choices -->
    <div class="final-layer" id="finalLayer">
      <div class="final-overlay"></div>
      <div class="final-content">
        <h1 class="final-title">Welcome to Amani&rsquo;s Kitchen</h1>
        <p class="final-subtitle">What would you like to explore?</p>
        <nav class="final-actions">
          <a href="#" class="final-btn" data-index="0">View Menu</a>
          <a href="#" class="final-btn" data-index="1">View Restaurant</a>
        </nav>
      </div>
    </div>

  </div>
</section>

<script src="js/lenis.min.js"></script>
<script src="js/cinematic.js"></script>
</body>
</html>
